undoBtn.addEventListener('click',undo);scrambleBtn.addEventListener('click',scramble);dimensionSelect.addEventListener('change',()=>changeDimension(Number(dimensionSelect.value)));
function startLayerGesture(ev,hit){gesture={mode:'layer-pending',pointerId:ev.pointerId,startX:ev.clientX,startY:ev.clientY,hit,axis:null,layer:null,tangent:null,angle:0,previewDir:1}}function cancelLayerGesture(){if(!gesture)return;if(currentPivot&&gesture.axis){const move={axis:gesture.axis,layer:gesture.layer,dir:gesture.previewDir||1};setPivotAngle(gesture.axis,0);finishPivot(move,false)}gesture=null}
function onPointerDown(ev){if(busy)return;renderer.domElement.setPointerCapture(ev.pointerId);pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});if(pointers.size===2&&gesture?.mode==='camera'){const pts=[...pointers.values()];pinch={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),startDistance:distance};gesture.mode='pinch';return}if(pointers.size>1)return;const hit=pick(ev.clientX,ev.clientY);if(hit)startLayerGesture(ev,hit);else gesture={mode:'camera',pointerId:ev.pointerId,startX:ev.clientX,startY:ev.clientY,startYaw:yaw,startPitch:pitch}}
function onPointerMove(ev){if(!pointers.has(ev.pointerId))return;pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});if(gesture?.mode==='pinch'&&pointers.size>=2){const pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch&&d>1){distance=Math.max(5.2,Math.min(10.5,pinch.startDistance*(pinch.dist/d)));updateCamera()}return}if(!gesture||gesture.pointerId!==ev.pointerId)return;if(gesture.mode==='camera'){const dx=ev.clientX-gesture.startX,dy=ev.clientY-gesture.startY;yaw=gesture.startYaw-dx*.0082;pitch=Math.max(-1.05,Math.min(1.05,gesture.startPitch+dy*.0074));updateCamera();return}if(gesture.mode==='layer-pending'){const dx=ev.clientX-gesture.startX,dy=ev.clientY-gesture.startY;if(Math.hypot(dx,dy)<9)return;const choice=chooseLayerAxis(gesture,dx,dy);if(!choice)return;gesture.axis=choice.axis;gesture.tangent=choice.screen;gesture.layer=gesture.hit.cubie.userData.coord[choice.axis];gesture.mode='layer';beginPivot({axis:gesture.axis,layer:gesture.layer,dir:1});setTrackFocus(gesture.axis)}if(gesture.mode==='layer'){const dx=ev.clientX-gesture.startX,dy=ev.clientY-gesture.startY,along=dx*gesture.tangent.x+dy*gesture.tangent.y,sensitivity=Math.max(90,124-N*4),angle=Math.max(-Math.PI/2,Math.min(Math.PI/2,along*(Math.PI/2/sensitivity)));gesture.angle=angle;gesture.previewDir=angle<0?-1:1;setPivotAngle(gesture.axis,angle);render2DPreview({axis:gesture.axis,layer:gesture.layer,dir:gesture.previewDir},Math.abs(angle)/(Math.PI/2))}}
async function onPointerUp(ev){pointers.delete(ev.pointerId);if(gesture?.mode==='pinch'){if(pointers.size===0){gesture=null;pinch=null}else if(pointers.size===1){const remaining=[...pointers.entries()][0];gesture={mode:'camera',pointerId:remaining[0],startX:remaining[1].x,startY:remaining[1].y,startYaw:yaw,startPitch:pitch};pinch=null}return}if(!gesture||gesture.pointerId!==ev.pointerId)return;if(gesture.mode==='camera'||gesture.mode==='layer-pending'){gesture=null;return}if(gesture.mode==='layer'){const g=gesture;gesture=null;const dir=g.angle<0?-1:1,move={axis:g.axis,layer:g.layer,dir},commit=Math.abs(g.angle)>=Math.PI/4;if(commit)showStatus(moveLabel(move));await animatePivotTo(move,g.angle,commit?dir*Math.PI/2:0,160,{record:commit})}}
function onPointerCancel(ev){pointers.delete(ev.pointerId);if(gesture&&gesture.pointerId===ev.pointerId)cancelLayerGesture()}renderer.domElement.addEventListener('pointerdown',onPointerDown);renderer.domElement.addEventListener('pointermove',onPointerMove);renderer.domElement.addEventListener('pointerup',onPointerUp);renderer.domElement.addEventListener('pointercancel',onPointerCancel);renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('wheel',ev=>{ev.preventDefault();distance=Math.max(5.2,Math.min(10.5,distance+ev.deltaY*.006));updateCamera()},{passive:false});
function render(){renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);setButtons();setTimeout(()=>instruction.classList.add('hide'),3600);panel.addEventListener('pointerdown',()=>instruction.classList.add('hide'),{once:true});
})();
